[package]
name = "webpets"
version = "0.0.1"
description = "WebPets: a desktop pet that lives in a pixel-art habitat"
authors = ["Sammy Thayer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "webpets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compiles src/harness.rs and registers its two commands: a file-driven remote control for driving
# the packaged app from a shell script (docs/HARNESS.md). Off by default; `npm run build:harness`
# turns it on. Never ship a build with it.
harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Claude-written lines (src/voice.rs): the HTTP client is already in the graph through the Tauri
# plugins; native-tls uses the macOS TLS stack rather than compiling another one. The Keychain read
# goes through the same Security framework bindings native-tls pulls in.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
security-framework = "3"

# Is a full-screen window in front (src/idle.rs): the window list and display bounds, from the same
# versions the windowing layer already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

# The one place this app reaches into AppKit. macOS gates "stay visible over a fullscreen app" behind a
# window collection-behavior flag that neither Tauri nor the windowing layer under it exposes, and there
# is no cross-platform way to ask for it. Pinned to the version already in the lock file as a transitive
# dependency of the windowing layer, so this adds no new graph.
[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = ["std", "libc", "NSResponder", "NSWindow", "NSRunningApplication", "NSWorkspace"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
